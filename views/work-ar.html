<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>أعمالك · غالية</title>
    <link href="assets/vendor/bootstrap.rtl.min.css" rel="stylesheet" />
    <link href="assets/vendor/aos.css" rel="stylesheet" />
    <link href="assets/css/mt-style.css?v=20260910" rel="stylesheet" />
  </head>
  <body class="mt-application-page mt-step-3">
    <!-- Site header -->
    <header class="mt-site-header">
      <nav class="navbar">
        <div class="container">
          <a class="mt-brand" href="index-ar.html">
            <img src="assets/images/ghalya-logo.png" alt="Ghalya" />
          </a>
          <div class="d-flex align-items-center gap-3">
            <a class="mt-nav-link d-none d-sm-inline" href="terms-ar.html">
              الشروط
            </a>
            <a class="mt-lang-link" href="work.html">English</a>
          </div>
        </div>
      </nav>
    </header>
    <!-- Main content -->
    <main class="mt-form-page">
      <div class="container">
        <div class="mt-form-layout">
          <!-- Application progress -->
          <aside class="mt-form-aside" data-aos="fade-up">
            <h2>طلب الانضمام إلى غالية</h2>
            <p>شارك القنوات والمحتوى الذي يمثل أسلوبك الإبداعي.</p>
            <ol class="mt-progress-list">
              <li class="mt-progress-item mt-is-done">
                <span class="mt-progress-number">✓</span>
                <span>الملف الشخصي</span>
              </li>
              <li class="mt-progress-item mt-is-done">
                <span class="mt-progress-number">✓</span>
                <span>المستوى</span>
              </li>
              <li class="mt-progress-item mt-is-active">
                <span class="mt-progress-number">3</span>
                <span>أعمالك</span>
              </li>
              <li class="mt-progress-item">
                <span class="mt-progress-number">4</span>
                <span>المقترح</span>
              </li>
              <li class="mt-progress-item">
                <span class="mt-progress-number">5</span>
                <span>التواصل</span>
              </li>
            </ol>
          </aside>
          <!-- Current application step -->
          <form
            action="proposal-ar.html"
            class="mt-form-card mt-js-form"
            data-aos="fade-up"
            data-aos-delay="80"
            data-mt-next="proposal-ar.html"
            method="get"
          >
            <div class="mt-form-top">
              <a class="mt-back-link" href="tier-ar.html">السابق</a>
              <span class="mt-step-label">الخطوة 3 من 5</span>
            </div>
            <h1 class="mt-form-title">أعمالك</h1>
            <p class="mt-form-intro">
              أضف حساباتك العامة ومثالًا لمحتوى سابق للعلامات التجارية إن توفر.
            </p>
            <div class="row g-3">
              <div class="col-md-6">
                <div class="mt-field">
                  <label class="mt-label" for="ig-ar">رابط حساب إنستغرام</label>
                  <input
                    class="mt-input"
                    id="ig-ar"
                    name="instagram_url"
                    placeholder="رابط حساب إنستغرام"
                    required
                    type="url"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mt-field">
                  <label class="mt-label" for="tt-ar">
                    رابط حساب تيك توك
                  </label>
                  <input
                    class="mt-input"
                    id="tt-ar"
                    name="tiktok_url"
                    placeholder="رابط حساب تيك توك"
                    required
                    type="url"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mt-field">
                  <label class="mt-label" for="sc-ar">
                    اسم مستخدم سناب شات
                  </label>
                  <input
                    class="mt-input"
                    id="sc-ar"
                    name="snapchat"
                    placeholder="اسم مستخدم سناب شات"
                    required
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mt-field">
                  <label class="mt-label" for="bc-ar">
                    محتوى سابق للعلامات
                  </label>
                  <input
                    class="mt-input"
                    id="bc-ar"
                    name="brand_content_url"
                    placeholder="رابط المحتوى"
                    required
                    type="url"
                  />
                </div>
              </div>
            </div>
            <div
              class="mt-extra-links"
              id="additional-work-links-ar"
              data-mt-extra-links
              aria-live="polite"
            ></div>
            <button
              class="mt-back-link mt-add-link"
              type="button"
              data-mt-add-link
              aria-controls="additional-work-links-ar"
              data-mt-label="محتوى سابق للعلامات"
              data-mt-placeholder="رابط المحتوى"
            >
              + إضافة رابط آخر
            </button>
            <div class="mt-form-actions">
              <a class="mt-btn-secondary" href="tier-ar.html">رجوع</a>
              <button class="mt-btn-primary" type="submit">متابعة</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <!-- Page scripts -->
    <script src="assets/vendor/jquery.js?v=20260910"></script>
    <script src="assets/vendor/jquery.validate.js?v=20260910"></script>
    <script src="assets/vendor/aos.js?v=20260910"></script>
    <script src="assets/js/mt-app.js?v=20260911"></script>
  </body>
</html>
