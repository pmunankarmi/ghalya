          </div>
        </div>
      </nav>
    </header>
    <!-- Main content -->
    <main class="mt-form-page">
      <div class="container">
        <div class="mt-form-layout">
          <!-- Application progress -->
          <aside class="mt-form-aside" data-aos="fade-up">
            <h2>One final step</h2>
            <p>
              Add your contact details and review the program terms before
              submitting.
            </p>
            <ol class="mt-progress-list">
              <li class="mt-progress-item mt-is-done">
                <span class="mt-progress-number">✓</span>
                <span>Profile</span>
              </li>
              <li class="mt-progress-item mt-is-done">
                <span class="mt-progress-number">✓</span>
                <span>Tier</span>
              </li>
              <li class="mt-progress-item mt-is-done">
                <span class="mt-progress-number">✓</span>
                <span>Work</span>
              </li>
              <li class="mt-progress-item mt-is-done">
                <span class="mt-progress-number">✓</span>
                <span>Proposal</span>
              </li>
              <li class="mt-progress-item mt-is-active">
                <span class="mt-progress-number">5</span>
                <span>Contact</span>
              </li>
            </ol>
          </aside>
          <!-- Current application step -->
          <form
            action="sendmail.php"
            class="mt-form-card mt-js-form"
            data-aos="fade-up"
            data-aos-delay="80"
            data-mt-sendmail
            method="post"
          >
            <input name="language" type="hidden" value="en" />
            <input name="application_data" type="hidden" value="" />
            <div class="mt-form-top">
              <a class="mt-back-link" href="proposal.html">Previous</a>
              <span class="mt-step-label">Step 5 of 5</span>
            </div>
            <h1 class="mt-form-title">Contact details</h1>
            <p class="mt-form-intro">
              Where should the Ghalya team reach you about this campaign?
            </p>
            <div class="row g-3">
              <div class="col-md-6">
                <div class="mt-field">
                  <label class="mt-label" for="email">Email Address</label>
                  <input
                    class="mt-input"
                    id="email"
                    name="email"
                    required
                    type="email"
                    placeholder="email@email.com"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mt-field">
                  <label class="mt-label" for="phone">Mobile Number</label>
                  <input
                    class="mt-input"
                    id="phone"
                    minlength="8"
                    name="phone"
                    required
                    type="tel"
                    placeholder="+966 0000 0000"
                  />
                </div>
              </div>
            </div>
            <label class="mt-agree mt-4">
              <input name="terms" required type="checkbox" />
              <span>
                I agree to Ghalya’s
                <a href="terms.html">terms and conditions</a>
                and allow Ghalya to contact me about this campaign.
              </span>
            </label>
            <div class="mt-form-actions">
              <a class="mt-btn-secondary" href="proposal.html">Back</a>
              <button class="mt-btn-primary" type="submit">
                Submit application
              </button>
            </div>
          </form>
